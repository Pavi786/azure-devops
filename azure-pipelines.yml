
trigger: none
pr: none

pool:
  name: Linux-agent

variables:
  - group: dockerhub-secrets

  - name: IMAGE_REPOSITORY
    value: 'jillapavi2001/payflow-core-api'

  - name: IMAGE_TAG
    value: '$(Build.BuildId)'

  - name: CONTAINER_NAME
    value: 'payflow-public-demo'

  - name: APP_PORT
    value: '18080'

steps:

# ==================================================
# 1. CHECK AGENT AND INSTALL DOCKER
# ==================================================

- script: |
    set -e

    echo "========== AGENT INFORMATION =========="
    hostname
    whoami
    uname -a
    df -h
    free -h

    sudo apt-get update
    sudo apt-get install -y git curl ca-certificates

    if ! command -v docker >/dev/null 2>&1; then
      sudo apt-get install -y docker.io
    fi

    if ! sudo docker info >/dev/null 2>&1; then
      sudo systemctl enable --now docker
    fi

    sudo docker info >/dev/null

    echo "Docker is ready."
  displayName: '1. Check Agent and Docker'


# ==================================================
# 2. GENERATE SAMPLE APPLICATION
# ==================================================

- script: |
    set -e

    WORK_DIR="$(Build.SourcesDirectory)/payflow-public-demo"
    mkdir -p "$WORK_DIR"
    cd "$WORK_DIR"

    cat > server.js <<'EOF'
    const http = require('http');

    const PORT = Number(process.env.PORT || 8080);

    const server = http.createServer((req, res) => {
      if (req.url === '/health') {
        res.writeHead(200, {
          'Content-Type': 'application/json',
          'Cache-Control': 'no-store'
        });

        return res.end(JSON.stringify({
          status: 'healthy',
          service: 'payflow-core-api',
          timestamp: new Date().toISOString()
        }));
      }

      if (req.url === '/' || req.url === '/index.html') {
        res.writeHead(200, {
          'Content-Type': 'text/html; charset=utf-8',
          'Cache-Control': 'no-store'
        });

        return res.end(`<!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>PayFlow DevSecOps</title>
      <style>
        body {
          margin: 0;
          padding: 30px;
          font-family: Arial, sans-serif;
          background: #0f172a;
          color: #f8fafc;
        }
        main { max-width: 850px; margin: auto; }
        .card {
          margin-top: 20px;
          padding: 24px;
          border: 1px solid #334155;
          border-radius: 14px;
          background: #1e293b;
        }
        .healthy { color: #4ade80; }
        button {
          padding: 12px 16px;
          border: 0;
          border-radius: 8px;
          background: #2563eb;
          color: white;
          cursor: pointer;
        }
        pre { white-space: pre-wrap; overflow-wrap: anywhere; }
      </style>
    </head>
    <body>
      <main>
        <h1>PayFlow Core Banking</h1>
        <p>Azure DevOps | Docker | DevSecOps</p>
        <section class="card">
          <h2>Application Health</h2>
          <p id="status">Checking...</p>
          <button onclick="checkHealth()">Refresh health</button>
          <pre id="details"></pre>
        </section>
        <section class="card">
          <h2>Security Pipeline</h2>
          <p>Source secret scan: Gitleaks</p>
          <p>Image vulnerability scan: Trivy</p>
          <p>Software inventory: SBOM</p>
          <p>Deployment: gated by security checks</p>
        </section>
      </main>
      <script>
        async function checkHealth() {
          try {
            const response = await fetch('/health', {cache: 'no-store'});
            const result = await response.json();
            document.getElementById('status').textContent =
              response.ok ? 'HEALTHY' : 'UNHEALTHY';
            document.getElementById('status').className =
              response.ok ? 'healthy' : '';
            document.getElementById('details').textContent =
              JSON.stringify(result, null, 2);
          } catch (_) {
            document.getElementById('status').textContent = 'UNAVAILABLE';
          }
        }
        checkHealth();
      </script>
    </body>
    </html>`);
      }

      res.writeHead(404, {'Content-Type': 'application/json'});
      res.end(JSON.stringify({error: 'Not found'}));
    });

    server.listen(PORT, '0.0.0.0', () => {
      console.log('PayFlow listening on port ' + PORT);
    });
    EOF

    cat > Dockerfile <<'EOF'
    FROM node:20-alpine

    WORKDIR /app

    ENV NODE_ENV=production
    ENV PORT=8080

    COPY --chown=node:node server.js ./server.js

    USER node
    EXPOSE 8080

    HEALTHCHECK --interval=10s --timeout=3s --start-period=5s --retries=3 \
      CMD node -e "require('http').get('http://127.0.0.1:8080/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"

    CMD ["node", "server.js"]
    EOF

    cat > .dockerignore <<'EOF'
    .git
    .env
    *.log
    EOF

    echo "Generated source and Dockerfile."
    node --check server.js
  displayName: '2. Generate Application and Dockerfile'


# ==================================================
# 3. INSTALL AND RUN GITLEAKS
# Scan Git history for accidental secrets
# ==================================================

- script: |
    set -e

    echo "========== GITLEAKS SECRET SCAN =========="

    GITLEAKS_VERSION="8.24.3"
    ARCH="$(uname -m)"

    case "$ARCH" in
      x86_64) GITLEAKS_ARCH="x64" ;;
      aarch64|arm64) GITLEAKS_ARCH="arm64" ;;
      *)
        echo "Unsupported architecture: $ARCH"
        exit 1
        ;;
    esac

    ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_${GITLEAKS_ARCH}.tar.gz"
    URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}"

    curl -fsSL "$URL" -o /tmp/gitleaks.tar.gz
    tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
    sudo install /tmp/gitleaks /usr/local/bin/gitleaks

    cd "$(Build.SourcesDirectory)"

    # Scan committed repository history.
    gitleaks git --redact --verbose .

    # Also scan the generated application and Dockerfile.
    gitleaks dir --redact --verbose \
      "$(Build.SourcesDirectory)/payflow-public-demo"

    echo "Gitleaks scans passed."
  displayName: '3. Scan Source for Secrets'


# ==================================================
# 4. BUILD DOCKER IMAGE
# ==================================================

- script: |
    set -e

    cd "$(Build.SourcesDirectory)/payflow-public-demo"

    echo "========== BUILD IMAGE =========="

    sudo docker build --pull \
      -t "$(IMAGE_REPOSITORY):$(IMAGE_TAG)" \
      -t "$(IMAGE_REPOSITORY):latest" \
      .

    sudo docker images "$(IMAGE_REPOSITORY)"
  displayName: '4. Build Docker Image'


# ==================================================
# 5. TRIVY VULNERABILITY SCAN
# Fail if HIGH or CRITICAL vulnerabilities are found
# ==================================================

- script: |
    set -e

    echo "========== TRIVY IMAGE SCAN =========="

    sudo docker pull aquasec/trivy:0.69.3

    sudo docker run --rm \
      -v /var/run/docker.sock:/var/run/docker.sock \
      -v "$(Build.SourcesDirectory):/work" \
      aquasec/trivy:0.69.3 \
      image \
      --scanners vuln \
      --severity HIGH,CRITICAL \
      --ignore-unfixed \
      --exit-code 1 \
      "$(IMAGE_REPOSITORY):$(IMAGE_TAG)"

    echo "Security gate passed: no matching HIGH/CRITICAL findings."
  displayName: '5. Scan Image with Trivy'


# ==================================================
# 6. GENERATE SBOM
# ==================================================

- script: |
    set -e

    echo "========== GENERATE SBOM =========="

    sudo docker run --rm \
      -v /var/run/docker.sock:/var/run/docker.sock \
      -v "$(Build.SourcesDirectory):/work" \
      aquasec/trivy:0.69.3 \
      image \
      --format cyclonedx \
      --output /work/payflow-sbom.cdx.json \
      "$(IMAGE_REPOSITORY):$(IMAGE_TAG)"

    test -s "$(Build.SourcesDirectory)/payflow-sbom.cdx.json"

    echo "SBOM generated."
    ls -lh "$(Build.SourcesDirectory)/payflow-sbom.cdx.json"
  displayName: '6. Generate Software Bill of Materials'
  condition: succeeded()


# ==================================================
# 7. PUBLISH SBOM AS PIPELINE ARTIFACT
# ==================================================

- task: PublishPipelineArtifact@1
  displayName: '7. Publish SBOM Artifact'
  condition: succeeded()
  inputs:
    targetPath: '$(Build.SourcesDirectory)/payflow-sbom.cdx.json'
    artifact: 'payflow-sbom'
    publishLocation: 'pipeline'


# ==================================================
# 8. LOGIN TO DOCKER HUB
# ==================================================

- script: |
    set -eu
    set +x

    echo "========== DOCKER HUB LOGIN =========="

    printf '%s' "$DOCKERHUB_TOKEN" |
      sudo docker login \
        --username "$DOCKERHUB_USERNAME" \
        --password-stdin

    echo "Docker Hub authentication succeeded."
  displayName: '8. Authenticate to Docker Hub'
  env:
    DOCKERHUB_USERNAME: $(DOCKERHUB_USERNAME)
    DOCKERHUB_TOKEN: $(DOCKERHUB_TOKEN)


# ==================================================
# 9. PUSH IMAGE ONLY AFTER SECURITY GATES PASS
# ==================================================

- script: |
    set -e

    echo "========== PUSH VERIFIED IMAGE =========="

    sudo docker push "$(IMAGE_REPOSITORY):$(IMAGE_TAG)"
    sudo docker push "$(IMAGE_REPOSITORY):latest"

    echo "Image push succeeded."
  displayName: '9. Push Verified Image'
  condition: succeeded()


# ==================================================
# 10. DEPLOY AND VERIFY HEALTH
# Preserve the old container until the new one passes
# ==================================================

- script: |
    set -eu

    echo "========== DEPLOYMENT =========="

    NEW_NAME="$(CONTAINER_NAME)-candidate"
    OLD_NAME="$(CONTAINER_NAME)-previous"
    OLD_EXISTS=false
    NEW_STARTED=false

    # Clean up a leftover candidate from an earlier failed run.
    sudo docker rm -f "$NEW_NAME" >/dev/null 2>&1 || true

    # Start candidate on a temporary local-only port.
    sudo docker run -d \
      --name "$NEW_NAME" \
      -p 127.0.0.1:18081:8080 \
      "$(IMAGE_REPOSITORY):$(IMAGE_TAG)"

    NEW_STARTED=true

    rollback() {
      echo "Deployment failed; restoring previous container if available."

      sudo docker rm -f "$NEW_NAME" >/dev/null 2>&1 || true

      if [ "$OLD_EXISTS" = "true" ]; then
        sudo docker rm -f "$(CONTAINER_NAME)" >/dev/null 2>&1 || true
        sudo docker rename "$OLD_NAME" "$(CONTAINER_NAME)" || true
        sudo docker start "$(CONTAINER_NAME)" || true
      fi
    }

    READY=false

    for attempt in $(seq 1 20); do
      if curl --fail --silent \
        http://127.0.0.1:18081/health >/dev/null; then
        READY=true
        break
      fi
      sleep 2
    done

    if [ "$READY" != "true" ]; then
      sudo docker logs "$NEW_NAME" || true
      rollback
      exit 1
    fi

    echo "Candidate health check passed."

    # Keep previous container for rollback until candidate is healthy.
    if sudo docker container inspect "$(CONTAINER_NAME)" >/dev/null 2>&1; then
      sudo docker rm -f "$OLD_NAME" >/dev/null 2>&1 || true
      sudo docker rename "$(CONTAINER_NAME)" "$OLD_NAME"
      OLD_EXISTS=true
    fi

    # Stop candidate, free the public port, and start on public port.
    sudo docker rm -f "$NEW_NAME"
    NEW_STARTED=false

    if ! sudo docker run -d \
      --name "$(CONTAINER_NAME)" \
      --restart unless-stopped \
      -p "0.0.0.0:$(APP_PORT):8080" \
      "$(IMAGE_REPOSITORY):$(IMAGE_TAG)"; then
      rollback
      exit 1
    fi

    READY=false

    for attempt in $(seq 1 20); do
      if curl --fail --silent \
        "http://127.0.0.1:$(APP_PORT)/health" >/dev/null; then
        READY=true
        break
      fi
      sleep 2
    done

    if [ "$READY" != "true" ]; then
      sudo docker logs "$(CONTAINER_NAME)" || true
      rollback
      exit 1
    fi

    echo "========== FINAL HEALTH RESPONSE =========="
    curl --fail --silent --show-error \
      "http://127.0.0.1:$(APP_PORT)/health"

    echo
    echo "========== DEPLOYMENT STATUS =========="
    sudo docker ps --filter "name=$(CONTAINER_NAME)"

    # The new deployment is healthy; old container can now be removed.
    if [ "$OLD_EXISTS" = "true" ]; then
      sudo docker rm -f "$OLD_NAME" >/dev/null 2>&1 || true
    fi

    echo "Deployment and health verification succeeded."
  displayName: '10. Deploy and Verify Application'
  condition: succeeded()


# ==================================================
# 11. SHOW URLS AND SECURITY SUMMARY
# ==================================================

- script: |
    set -e

    echo "========== DEVSECOPS SUMMARY =========="

    PUBLIC_IP="$(curl -4 -fsS --max-time 10 https://api.ipify.org || true)"

    echo "Image: $(IMAGE_REPOSITORY):$(IMAGE_TAG)"
    echo "Security scan: passed if this stage was reached"
    echo "SBOM artifact: payflow-sbom"

    if [ -n "$PUBLIC_IP" ]; then
      echo "Potential public UI URL: http://$PUBLIC_IP:$(APP_PORT)/"
      echo "Health endpoint: http://$PUBLIC_IP:$(APP_PORT)/health"
    else
      echo "Use the agent host's reachable public IP or DNS."
    fi

    echo "Public access requires inbound TCP $(APP_PORT)."
  displayName: '11. Print Deployment Summary'
  condition: succeeded()


# ==================================================
# 12. LOG OUT
# ==================================================

- script: |
    set +e
    sudo docker logout
    echo "Docker Hub logout attempted."
  displayName: '12. Docker Hub Logout'
  condition: always()
