trigger: none
pr: none

pool:
  name: Linux-agent

variables:
  - group: dockerhub-secrets
  - name: imageName
    value: 'jillapavi2001/payflow-core-api'
  - name: imageTag
    value: '$(Build.BuildId)'

steps:
  - checkout: self
    fetchDepth: 0

  - script: |
      set -eu
      echo "Checking Docker..."
      docker --version
      docker info
    displayName: '1. Verify Docker and Agent'

  - script: |
      set -eu

      APP_DIR="$(Build.SourcesDirectory)/payflow-public-demo"
      mkdir -p "$APP_DIR"

      cat > "$APP_DIR/server.js" <<'EOF'
      const http = require('http');

      const server = http.createServer((req, res) => {
        if (req.url === '/health') {
          res.writeHead(200, { 'Content-Type': 'application/json' });
          return res.end(JSON.stringify({ status: 'healthy' }));
        }

        res.writeHead(200, { 'Content-Type': 'text/html; charset=utf-8' });
        res.end(`
          <!doctype html>
          <html>
            <head>
              <title>PayFlow Demo</title>
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <style>
                body { font-family: Arial; margin: 40px; background: #f3f6fb; }
                main { max-width: 650px; margin: auto; padding: 30px;
                       background: white; border-radius: 12px; }
                h1 { color: #174ea6; }
              </style>
            </head>
            <body>
              <main>
                <h1>PayFlow Demo</h1>
                <p>Node.js application running inside Docker.</p>
                <p>Built and scanned by Azure DevOps.</p>
                <p>Health endpoint: /health</p>
              </main>
            </body>
          </html>
        `);
      });

      server.listen(3000, '0.0.0.0', () => {
        console.log('PayFlow demo listening on port 3000');
      });
      EOF

      cat > "$APP_DIR/Dockerfile" <<'EOF'
      FROM node:24-trixie-slim

      WORKDIR /app

      # Refresh the bundled npm packages, including npm's dependencies.
      RUN npm install --global npm@latest 
          && npm cache clean --force

      COPY server.js .

      RUN node --check server.js 
          && chown -R node:node /app

      USER node

      EXPOSE 3000

      HEALTHCHECK --interval=30s --timeout=3s --start-period=5s --retries=3 
        CMD node -e "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"

      CMD ["node", "server.js"]
      EOF

      cat > "$APP_DIR/.dockerignore" <<'EOF'
      .git
      node_modules
      npm-debug.log
      .env
      *.pem
      *.key
      EOF

      echo "Generated application and Dockerfile."
    displayName: '2. Generate Demo Application'

  - script: |
      set -eu
      docker build --pull 
        -t "$(imageName):$(imageTag)" 
        -t "$(imageName):latest" 
        "$(Build.SourcesDirectory)/payflow-public-demo"
    displayName: '3. Build Docker Image'

  - script: |
      set -eu

      mkdir -p "$(Build.ArtifactStagingDirectory)/security"

      echo "Scanning for HIGH and CRITICAL vulnerabilities."
      echo "Unfixed vulnerabilities will be reported but will not block this gate."

      docker run --rm 
        -v /var/run/docker.sock:/var/run/docker.sock 
        -v "$(Build.ArtifactStagingDirectory)/security:/reports" 
        aquasec/trivy:0.69.3 image 
        --scanners vuln 
        --severity HIGH,CRITICAL 
        --format table 
        --ignore-unfixed 
        "$(imageName):$(imageTag)"

      echo "Trivy gate passed."
    displayName: '4. Scan Image with Trivy'

  - script: |
      set -eu

      docker run --rm 
        -v /var/run/docker.sock:/var/run/docker.sock 
        -v "$(Build.ArtifactStagingDirectory)/security:/reports" 
        aquasec/trivy:0.69.3 image 
        --scanners vuln 
        --format cyclonedx 
        --output /reports/payflow-sbom.cdx.json 
        "$(imageName):$(imageTag)"

      test -s "$(Build.ArtifactStagingDirectory)/security/payflow-sbom.cdx.json"
      echo "SBOM generated successfully."
    displayName: '5. Generate CycloneDX SBOM'

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/security'
      artifact: 'payflow-security-reports'
      publishLocation: 'pipeline'
    displayName: '6. Publish Security Reports'

  - script: |
      set -eu

      echo "$DOCKERHUB_TOKEN" | docker login 
        --username "$DOCKERHUB_USERNAME" 
        --password-stdin

      docker push "$(imageName):$(imageTag)"
      docker push "$(imageName):latest"

      docker logout
    displayName: '7. Push Image to Docker Hub'
    env:
      DOCKERHUB_USERNAME: $(DOCKERHUB_USERNAME)
      DOCKERHUB_TOKEN: $(DOCKERHUB_TOKEN)
