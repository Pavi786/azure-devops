trigger: none
pr: none

pool:
  name: Linux-agent

jobs:
- job: MavenBuild
  displayName: 'Build Java Application'
  steps:
  - script: |
      echo "Running on agent:"
      hostname
      whoami
      pwd
    displayName: 'Check Agent'

- job: DockerBuild
  displayName: 'Build Docker Image'
  steps:
  - script: |
      echo "Running on agent:"
      hostname
      whoami
      pwd
    displayName: 'Check Agent'