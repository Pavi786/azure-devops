
trigger: none
pr: none

jobs:
- job: Job1
  displayName: 'Run on maven-server'
  pool:
    name: Linux-agent
    demands:
      - Agent.Name -equals maven-server
  steps:
  - script: |
      echo "Expected agent: maven-server"
      hostname
      sleep 60

- job: Job2
  displayName: 'Run on Maven-server-2'
  pool:
    name: Linux-agent
    demands:
      - Agent.Name -equals Maven-server-2
  steps:
  - script: |
      echo "Expected agent: Maven-server-2"
      hostname
      sleep 60
